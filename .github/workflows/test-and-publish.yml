name: Test and Publish

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is Intel x86_64, macos-15 is Apple Silicon ARM64.
        # aqequil and pychnosz publish wheels for macOS 15+ on both.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
        # Oldest and newest supported Python versions
        python-version: ['3.10', '3.14']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with geochem and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[geochem,test]"

      - name: Show installed versions
        run: python -m pip list

      - name: Run notebooks
        run: python -m pytest test -v

  test-oldest-deps:
    # Install the lowest versions allowed by pyproject.toml to check that the
    # minimum version pins are still accurate.
    name: Oldest dependencies / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package with lowest direct dependency versions
        run: |
          python -m pip install uv
          # Test tooling is not what we are checking, so keep it modern
          uv pip install --system --resolution lowest-direct ".[geochem,test]" \
            "pytest>=8" "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6.29"

      - name: Show installed versions
        run: python -m pip list

      - name: Run notebooks
        run: python -m pytest test -v

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject.toml version {version!r}")
          print(f"Release tag matches version {version}")
          EOF

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload_pypi:
    name: Upload to PyPI
    needs: [test, test-oldest-deps, build]
    runs-on: ubuntu-latest
    # Only upload on release, and only if every test job passed
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: List files
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses trusted publishing (no API token needed if configured on PyPI)
          verbose: true
